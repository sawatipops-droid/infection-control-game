/* =========================
   ระบบสุ่ม
========================= */

let pool=[];
let current=0;
let score=0;
let answered=false;


function shuffle(array){

    return array
    .map(value => ({
        value:value,
        sort:Math.random()
    }))
    .sort((a,b)=>a.sort-b.sort)
    .map(obj=>obj.value);

}


/* =========================
   เริ่มเกม
========================= */
function start(){

    pool=shuffle(DATA);

    current=0;

    score=0;

    document
    .getElementById("home")
    .classList
    .add("hidden");

    document
    .getElementById("result")
    .classList
    .add("hidden");

    document
    .getElementById("game")
    .classList
    .remove("hidden");

    showQuestion();

}
/* =========================
   แสดงคำถาม
========================= */

function showQuestion(){

    answered=false;

    const data=pool[current];

    document
    .getElementById("tag")
    .textContent=
    data.group+
    " • Case "+
    data.case;

    document
    .getElementById("title")
    .textContent=
    data.title;

    document
    .getElementById("scene")
    .textContent=
    data.scene;

    document
    .getElementById("q")
    .textContent=
    (current+1)+
    ". "+
    data.q;

    document
    .getElementById("feedback")
    .textContent="";

    document
    .getElementById("bar")
    .style
    .width=
    (current/pool.length*100)+"%";


    const box=
    document.getElementById("opts");

    box.innerHTML="";
const options=
    shuffle(
        data.opts.map(
            (text,index)=>({
                text:text,
                index:index
            })
        )
    );


    options.forEach(option=>{

        const button=
        document.createElement("button");

        button.className="choice";

        button.textContent=
        option.text;

        button.onclick=()=>{
            checkAnswer(
                button,
                option.index,
                data.ans
            );
        };

        box.appendChild(button);

    });

}
/* =========================
   ตรวจคำตอบ
========================= */

function checkAnswer(
    button,
    selected,
    correct
){

    if(answered)
        return;

    answered=true;


    document
    .querySelectorAll(".choice")
    .forEach(button=>{
        button.disabled=true;
    });


    if(selected===correct){

        score++;

        button.classList.add("correct");

        document
        .getElementById("feedback")
        .textContent=
        "✓ ถูกต้อง";

    }

    else{

        button.classList.add("wrong");

        document
        .getElementById("feedback")
        .textContent=
        "✗ ยังไม่ถูก";

    }

}
/* =========================
   ข้อถัดไป
========================= */

function next(){

    if(!answered){

        document
        .getElementById("feedback")
        .textContent=
        "กรุณาเลือกคำตอบก่อน";

        return;

    }


    current++;


    if(current>=pool.length){

        document
        .getElementById("game")
        .classList
        .add("hidden");

        document
        .getElementById("result")
        .classList
        .remove("hidden");

        document
        .getElementById("score")
        .textContent=
        score+
        " / "+
        pool.length;

        return;

    }


    showQuestion();

}
